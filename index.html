<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading</title>
</head>
<style>
    /* GLOBAL */
body {
  margin: 0;
  background: #141414;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}

.hidden { display: none; }

/* SPLASH */
#splash {
  position: fixed;
  flex-direction: column;
  gap: 2rem;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}
  .loader,
.loader:before,
.loader:after {
  border-radius: 50%;
  width: 2.5em;
  height: 2.5em;
  animation-fill-mode: both;
  animation: bblFadInOut 1.8s infinite ease-in-out;
}
.loader {
  --color-1: #757575;
  --size: 1px;

  color: var(--color-1);
  font-size: calc(7 * var(--size));
  position: relative;
  text-indent: -9999em;
  transform: translateZ(0);
  animation-delay: -0.16s;
}
.loader:before,
.loader:after {
  content: '';
  position: absolute;
  top: 0;
}
.loader:before {
  left: -3.5em;
  animation-delay: -0.32s;
}
.loader:after {
  left: 3.5em;
}

@keyframes bblFadInOut {
  0%,
  80%,
  100% {
    box-shadow: 0 2.5em 0 -1.3em;
  }
  40% {
    box-shadow: 0 2.5em 0 0;
  }
}
</style>
<body>
 
   <div id="splash">
    <!--<video id="splashVideo" autoplay muted playsinline>
      <source src="tv/IMG_1454.mp4" type="video/mp4">
    </video>-->
    <img src="icon.png" style="aspect-ratio: 1/1; width: 6rem; height: 6rem;">
    <span class="loader"></span>
  </div>
</body>
<script>

    setTimeout(function() {
        window.location.href = "viewer.html"; 
    }, 3000)

    
</script>
</html>
