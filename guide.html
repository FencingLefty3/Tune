<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Guide</title>
</head>
<style>
    body {
        color: #ffffff;
        background: #2c2c2e;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        box-sizing: border-box;
    }
    .logo {
        display: flex;
        flex-direction: row;
        align-items: center;
        color: #757575;
        height: 3rem;
        margin: 1rem;
    }
    .row {
        display: flex;
        flex-direction: row;
        width: 100%;
        box-sizing: border-box;
        height: 4rem;
        margin: 2px 0;
        outline: 2px solid #757575;
    }
    .times {
        display: flex;
        flex-direction: row;
        width: 100%;
        box-sizing: border-box;
        height: 4rem;
        margin: 2px 0;
        outline: 2px solid #757575;
    }
    .left {
        box-sizing: border-box;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        height: 100%;
        width: 8rem;
        background-color: #1f1f20;
        margin-right: 0;
        outline: 2px solid #757575;
        flex: 0 0 8rem;
    }
    h4 {
        padding: 0 8px;
        margin: 2px;
    }
    p {
        padding: 0 8px;
        margin: 2px;
    }
    .content p {
        font-size: 0.8rem;
    }
    .content {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin-right: 2px;
        outline: 2px solid #757575;
    }
    .time {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
        margin-right: 0;
        background: #1f1f20;
    }
    .time-blank {
        flex: 0 0 8rem;
    }
    .left:hover {
        background-color: #757575;
    }
    .content:hover {
        background-color: #757575;
    }
    .program-track {
        box-sizing: border-box;
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        height: 100%;
        overflow: hidden;
        background: #252526;
    }

    .program {
        box-sizing: border-box;
        position: absolute;
        top: 0;
        height: 100%;
        overflow: hidden;
        padding: 0.5rem;
        background: #444;
        outline: 1px solid #757575;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .program.current {
        background: #356b3d;
    }
    .live-line {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #ff4545;
        z-index: 2;
        pointer-events: none;
    }
</style>
<body id="body">

    <div class="logo">
        <img src="icon.png" style="aspect-ratio: 1/1; width: 2rem; height: 2rem;">
        <h3 style="font-size: 1.8rem;">Tune</h3>
    </div>


    <div class="times" id="timeLegend"></div>
    <div id="channelRows"></div>
    <div id="guideError" role="status"></div>

</body>
<script>

    const HOUR_MS = 60 * 60 * 1000;
    const VISIBLE_HOURS = 5;

    let guideWindowStart = 0;
    let guideClock = null;

    function timelinePercent(milliseconds) {
        return (milliseconds / (VISIBLE_HOURS * HOUR_MS)) * 100;
    }

    async function getGuide() {
        const response = await fetch("/api/guide", { cache: "no-store" });
        if (!response.ok) {
            throw new Error(`Guide request failed: ${response.status}`);
        }

        return response.json();
    }

    function formatLocalTime(timestamp) {
        return new Intl.DateTimeFormat(undefined, {
            hour: "numeric",
            minute: "2-digit",
        }).format(timestamp);
    }

    function startOfLocalHour(timestamp) {
        const date = new Date(timestamp);
        date.setMinutes(0, 0, 0);
        return date.getTime();
    }

    function addTimeLegend(windowStart) {
        const legend = document.getElementById("timeLegend");
        legend.replaceChildren();

        const blank = document.createElement("div");
        blank.className = "time time-blank";
        legend.appendChild(blank);

        for (let hour = 0; hour < VISIBLE_HOURS; hour++) {
            const cell = document.createElement("div");
            cell.className = "time";

            const label = document.createElement("h4");
            label.textContent = formatLocalTime(windowStart + hour * HOUR_MS);

            cell.appendChild(label);
            legend.appendChild(cell);
        }
    }

    function addChannelRow(channel, index, windowStart, serverNow) {
        const row = document.createElement("div");
        row.className = "row";

        const label = document.createElement("div");
        label.className = "left";

        

        const number = document.createElement("h4");
        number.textContent = String(index + 1);

        label.addEventListener("click", () => {
            window.location.href = `viewer.html?channel=${encodeURIComponent(channel.title)}`; 
        
        });
        const title = document.createElement("p");
        title.textContent = channel.title || "Untitled channel";

        label.append(number, title);

        const track = document.createElement("div");
        track.className = "program-track";

        for (const event of channel.events || []) {
            const start = Date.parse(event.start_at_utc);
            const end = start + Number(event.duration_seconds) * 1000;
            const visibleStart = Math.max(start, windowStart);
            const visibleEnd = Math.min(
                end,
                windowStart + VISIBLE_HOURS * HOUR_MS
            );

            if (
                !Number.isFinite(start) ||
                !Number.isFinite(end) ||
                visibleEnd <= visibleStart
            ) {
                continue;
            }

            const block = document.createElement("div");
            block.className = "program";

            if (start <= serverNow && serverNow < end) {
                block.classList.add("current");
            }

            const leftPercent = timelinePercent(visibleStart - windowStart);
            const widthPercent = timelinePercent(visibleEnd - visibleStart);

            block.style.left = `${leftPercent}%`;
            block.style.width = `${widthPercent}%`;
            block.textContent = event.title || "Untitled program";
            block.title =
                `${event.title || "Untitled program"} — ${formatLocalTime(start)}`;

            track.appendChild(block);
        }

        const liveLine = document.createElement("div");
        liveLine.className = "live-line";
        track.appendChild(liveLine);

        row.append(label, track);
        return row;
    }

    function updateLiveLines() {
        if (!guideClock) return;

        const liveNow =
            guideClock.serverNowMs + (performance.now() - guideClock.receivedAt);
        const leftPercent = timelinePercent(liveNow - guideWindowStart);
        const visible =
            leftPercent >= 0 && leftPercent <= 100;

        document.querySelectorAll(".live-line").forEach(line => {
            line.style.left = `${leftPercent}%`;
            line.hidden = !visible;
        });
    }

    window.setInterval(updateLiveLines, 1000);

    async function updateGuide() {
        const errorElement = document.getElementById("guideError");

        try {
            const guide = await getGuide();
            if (!Array.isArray(guide.channels)) {
                throw new Error("The server returned an invalid channel list.");
            }

            const serverNow = Date.parse(guide.server_now_utc);
            if (!Number.isFinite(serverNow)) {
                throw new Error("The server returned an invalid time.");
            }

            guideClock = {
                serverNowMs: serverNow,
                receivedAt: performance.now(),
            };

            guideWindowStart = startOfLocalHour(serverNow);

            addTimeLegend(guideWindowStart);

            const rows = document.getElementById("channelRows");
            rows.replaceChildren();

            for (const [index, channel] of guide.channels.entries()) {
                rows.appendChild(
                    addChannelRow(
                        channel,
                        index,
                        guideWindowStart,
                        serverNow
                    )
                );
            }

            updateLiveLines();
            errorElement.textContent = "";
        } catch (error) {
            errorElement.textContent = `Could not load guide: ${error.message}`;
        }
    }
    

    updateGuide();
    window.setInterval(updateGuide, 60_000);
</script>
