<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Channel Viewer</title>
    <link rel="icon" type="image/x-icon" href="/tvLogo.ico">

    <style>
        body {
            color: #fff;
            font-family: Arial, sans-serif;
            background: conic-gradient(from 180deg in oklch, oklch(32.28% 0.0000 89.88) 0.0%, oklch(31.73% 0.0008 77.33) 7.1%, oklch(30.60% 0.0020 78.26) 14.3%, oklch(30.00% 0.0034 79.43) 21.4%, oklch(30.99% 0.0047 80.85) 28.6%, oklch(34.73% 0.0059 82.52) 35.7%, oklch(42.30% 0.0068 84.56) 42.9%, oklch(52.07% 0.0078 86.88) 50.0%, oklch(61.87% 0.0086 89.32) 57.1%, oklch(69.55% 0.0094 91.72) 64.3%, oklch(73.50% 0.0101 94.09) 71.4%, oklch(74.84% 0.0108 96.70) 78.6%, oklch(74.66% 0.0115 99.27) 85.7%, oklch(73.92% 0.0120 101.49) 92.9%, oklch(73.62% 0.0124 103.06) 100.0%);
            background-color: #000;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }
        .media {
            width: 100dvw;
            height: 100dvh;
        }
        .player {
            width: 100dvw;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
        }
        .playback {
            position: absolute;
            bottom: 15%;
            left: 10%;
            width: 80%;
            height: 4rem;
            background-color: #000;
            opacity: 0.4;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        .playback-checkbox {
            background: none;
            border: none;
            cursor: pointer;
            margin: 0 1rem;
            margin-top: 0.5rem;
        }
        .playback-button {
            background: none;
            border: 0;
            cursor: pointer;
        }

        .playback-button img {
            width: 2rem;
            height: 2rem;
        }

        .playback-button img[hidden] {
            display: none;
        }

        #playbackSlider {
            width: 80%;
        }
        .playback-checkbox:checked + #playButton {
            display: none;
        }
        .playback-checkbox:not(:checked) ~ #pauseButton {
            display: none;
        }

    </style>

</head><body>
    <div class="media" id="mediaPlayer">
       <!-- <audio class="player" controls><source src="./music/Chris Stapleton - Bad As I Used To Be (From F1® The Movie) [Official Visualizer] [p13Cn0mONP8].mp3" type="audio/mpeg"></audio>-->
    </div>
    
    <div class="playback">
        <div class="row">
            <button id="playPauseButton" class="playback-button"
                    type="button" aria-label="Play live">
                <img id="playButton" src="./play.svg" alt="">
                <img id="pauseButton" src="./pause.svg" alt="" hidden>
            </button>
            <p id="playbackStatus"></p>
        </div>

        <input id="playbackSlider" type="range"
            min="0" max="1" step="0.1" value="0" disabled>
    </div>
</body>
<script>
    let transitionTimer;
    let activePlayer = null;
    let isDraggingSlider = false;

    async function getGuide() {
        const response = await fetch("/api/guide", { cache: "no-store" });
        if (!response.ok) {
            throw new Error(`Guide request failed: ${response.status}`);
        }
        return response.json();
    }

    async function loadCurrentShow(shouldPlay = true) {
        const status = document.getElementById("playbackStatus");
        const playerHost = document.getElementById("mediaPlayer");
        const channelTitle = new URLSearchParams(location.search).get("channel");

        if (!channelTitle) {
            status.textContent = "No channel was specified.";
            return;
        }

        try {
            const guide = await getGuide();
            const serverNow = Date.parse(guide.server_now_utc);
            const receivedAt = performance.now();

            if (!Number.isFinite(serverNow) || !Array.isArray(guide.channels)) {
                throw new Error("The server returned invalid guide data.");
            }

            const channel = guide.channels.find(
                item => item.title === channelTitle
            );

            if (!channel) {
                status.textContent = `Channel "${channelTitle}" was not found.`;
                return;
            }

            const currentShow = (channel.events || []).find(event => {
                const start = Date.parse(event.start_at_utc);
                const duration = Number(event.duration_seconds);
                return Number.isFinite(start) &&
                    Number.isFinite(duration) &&
                    duration > 0 &&
                    start <= serverNow &&
                    serverNow < start + duration * 1000;
            });

            if (!currentShow) {
                status.textContent = `Nothing is currently scheduled on ${channelTitle}.`;
                return;
            }

            const start = Date.parse(currentShow.start_at_utc);
            const end = start + Number(currentShow.duration_seconds) * 1000;
            const filePath = new URL(currentShow.media_url, location.href).pathname;
            const isAudio = /\.(mp3|m4a|flac|wav|ogg)$/i.test(filePath);
            const player = document.createElement(isAudio ? "audio" : "video");


            player.className = "player";
            player.controls = false;
            player.playsInline = true;
            player.src = currentShow.media_url;

            activePlayer = player;
            connectPlayerControls(player);
            playerHost.replaceChildren(player);
            status.textContent = `${channelTitle} — ${currentShow.title}`;

            player.addEventListener("loadedmetadata", async () => {
                const estimatedServerNow =
                    serverNow + (performance.now() - receivedAt);
                const offsetSeconds = Math.max(
                    0,
                    (estimatedServerNow - start) / 1000
                );

                if (offsetSeconds >= Number(currentShow.duration_seconds)) {
                    status.textContent = "This show has ended. Loading the next show…";
                    loadCurrentShow();
                    return;
                }

                player.currentTime = Math.min(
                    offsetSeconds,
                    Math.max(0, player.duration - 0.25)
                );
                if (shouldPlay) {
                    try {
                        await player.play();
                    } catch {
                        status.textContent += " — press Play to start.";
                    }
                }
                try {
                    await player.play();
                } catch {
                    status.textContent += " — press Play to start.";
                }
            }, { once: true });

            window.clearTimeout(transitionTimer);
            const remainingMs = end - serverNow;
            const wasPlaying = !player.paused;

            transitionTimer = window.setTimeout(
                () => loadCurrentShow(wasPlaying),
                Math.max(1000, remainingMs)
            );
        } catch (error) {
            status.textContent = `Could not load channel: ${error.message}`;
        }
    }
    const playPauseButton = document.getElementById("playPauseButton");
    const playIcon = document.getElementById("playButton");
    const pauseIcon = document.getElementById("pauseButton");
    const playbackSlider = document.getElementById("playbackSlider");

    function updatePlayButton() {
        const isPlaying = activePlayer && !activePlayer.paused;

        playIcon.hidden = Boolean(isPlaying);
        pauseIcon.hidden = !isPlaying;
        playPauseButton.setAttribute(
            "aria-label",
            isPlaying ? "Pause" : "Play live"
        );
    }

    function updatePlaybackSlider() {
        if (!activePlayer || isDraggingSlider) return;

        const duration = activePlayer.duration;
        if (!Number.isFinite(duration) || duration <= 0) return;

        playbackSlider.max = String(duration);
        playbackSlider.value = String(activePlayer.currentTime);
        playbackSlider.disabled = false;
    }

    playPauseButton.addEventListener("click", () => {
        if (activePlayer && !activePlayer.paused) {
            activePlayer.pause();
            return;
        }

        // Reloads the currently scheduled show and seeks to its live position.
        loadCurrentShow(true);
    });

    playbackSlider.addEventListener("pointerdown", () => {
        isDraggingSlider = true;
    });

    playbackSlider.addEventListener("input", () => {
        if (activePlayer) {
            activePlayer.currentTime = Number(playbackSlider.value);
        }
    });

    playbackSlider.addEventListener("change", () => {
        isDraggingSlider = false;
        updatePlaybackSlider();
    });

    function connectPlayerControls(player) {
        player.addEventListener("play", updatePlayButton);
        player.addEventListener("pause", updatePlayButton);
        player.addEventListener("timeupdate", updatePlaybackSlider);
        player.addEventListener("durationchange", updatePlaybackSlider);
        player.addEventListener("loadedmetadata", updatePlaybackSlider);
    }

    loadCurrentShow();
</script>
